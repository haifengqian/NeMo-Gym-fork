# Standalone HSG configuration. Parent rem project still uses its requested nightly image.
deepcad:
  resources_servers:
    deepcad:
      entrypoint: app.py
      domain: coding
      verified: false
      description: Reconstruct DeepCAD solids with Python and CadQuery from fixed sampled diagonal or front, side, and top views with optional dimensions
      value: Filled voxel IoU at pitch 1/64 after independent bbox normalization; invalid code earns zero
      voxel_resolution: 64
      reference_root: resources_servers/deepcad/data
      sandbox_provider: sandbox
      sandbox_image: /home/rohitkumarj/data/deepcad/gym/cadquery-2.8.0.sqsh
      sandbox_python: /usr/local/bin/python
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/deepcad/data/example.jsonl
        num_repeats: 1

deepcad_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: deepcad
      model_server:
        type: responses_api_models
        name: policy_model

sandbox:
  enroot:
    create:
      data_path: /tmp/deepcad-enroot/data
      cache_path: /tmp/deepcad-enroot/cache
      runtime_path: /tmp/deepcad-enroot/runtime
      bypass_entrypoint: false
      rw: true
      remap_root: false
