<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepCAD live rollouts</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#111820;color:#e4edf5}header{padding:18px 24px;border-bottom:1px solid #34424f}h1{font-size:22px;margin:0 0 12px}main{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 105px)}aside,article{padding:18px;overflow:auto}aside{border-right:1px solid #34424f}input,select,button{padding:9px;border:1px solid #536475;border-radius:5px;background:#202d39;color:inherit}input{width:100%;margin:12px 0}.row{display:block;width:100%;text-align:left;margin:8px 0;white-space:pre-line;cursor:pointer}.active{border-color:#6ab9ff}pre{padding:16px;background:#1c2833;border:1px solid #34424f;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.comparison.axis{grid-template-columns:1fr}.comparison section{min-width:0}.images{display:flex;gap:14px;flex-wrap:wrap}figure{margin:0}img{background:white;max-width:100%;height:auto;max-height:524px}figcaption{padding:8px 0;color:#adbdca}.muted{color:#adbdca}a{color:#8dcaff}.toolbar{display:flex;gap:8px}button{cursor:pointer}.tabs{display:flex;gap:8px;margin-top:20px}@media(max-width:1200px){.comparison{grid-template-columns:1fr}}@media(max-width:800px){main{display:block;height:auto}aside{max-height:380px}article{overflow:visible}}
</style>
<header><h1>DeepCAD · live rollouts</h1><label>Experiment <select id="experiment"></select></label> <a id="folder" href="/">Experiment link</a> <span id="live" class="muted">Updates every 5 seconds</span></header>
<main><aside><input id="search" placeholder="Search task or rollout ID" aria-label="Search"><div class="toolbar"><select id="sort"><option value="newest">Newest first</option><option value="highest">Highest IoU</option><option value="lowest">Lowest IoU</option></select><button id="refresh">Refresh</button></div><p id="stats" class="muted"></p><div id="list"></div><div class="toolbar"><button id="prev">Previous</button><button id="next">Next</button></div></aside><article><div id="empty" class="muted">Rollouts appear here as the Gym verifier finishes them. Choose a rollout to inspect it.</div><section id="detail" hidden><h2 id="title"></h2><p id="summary"></p><div id="comparison" class="comparison"><section><h3>Input views</h3><div id="images" class="images"></div></section><section><h3>Generated object</h3><figure><figcaption id="preview-status" class="muted"></figcaption><img id="prediction" alt="Rendered generated CAD object" hidden></figure></section></div><p><a id="step" hidden>Download generated STEP</a></p><div class="tabs"><button data-tab="code">CadQuery code</button><button data-tab="output">Model response</button><button data-tab="prompt">Prompt</button><button data-tab="reward">Reward details</button></div><pre id="text"></pre></section></article></main>
<script>
const $=id=>document.getElementById(id);let experiment=decodeURIComponent(location.pathname.slice(1)),page=0,active='',detail=null,tab='code',pending=0;
async function get(path){const response=await fetch(path);if(!response.ok)throw Error(`HTTP ${response.status}`);return response.json()}
function base(){return encodeURIComponent(experiment)}
async function refresh(){try{const available=await get('/api/experiments');const selected=experiment;$('experiment').replaceChildren(...available.experiments.map(name=>new Option(name,name)));if(!available.experiments.includes(selected)){experiment=available.experiments[0]||'';active='';detail=null;$('detail').hidden=true;$('empty').hidden=false}else experiment=selected;$('experiment').value=experiment;if(!experiment){$('stats').textContent='No experiment folders yet';return}$('folder').href='/'+base();const data=await get('/api/rollouts/'+base()+'?'+new URLSearchParams({q:$('search').value,sort:$('sort').value,page}));$('stats').textContent=`${data.matched} matching / ${data.total} saved · page ${page+1}`;$('list').replaceChildren();for(const row of data.rows){const b=document.createElement('button');b.className='row'+(row.id===active?' active':'');b.textContent=`${row.task_id} · IoU ${Number(row.reward).toFixed(4)}\nDifficulty ${row.difficulty??'unknown'} · ${row.failure_kind||'valid'}${row.mask_sample?' · masked':''}\n${new Date(row.created_at*1000).toLocaleString()}`;b.onclick=()=>select(row.id);$('list').append(b)}$('prev').disabled=page===0;$('next').disabled=(page+1)*50>=data.matched;$('live').textContent='Live · updated '+new Date().toLocaleTimeString();if(!active&&data.rows.length)select(location.hash.slice(1)||data.rows[0].id);else if(active&&detail?.has_step&&!detail.has_preview&&detail.preview_status?.state!=='failed')select(active)}catch(error){$('stats').textContent='Unable to load rollouts: '+error.message}}
async function select(id){const request=++pending;try{const row=await get('/api/rollout/'+base()+'/'+encodeURIComponent(id));if(request!==pending)return;detail=row;active=id;history.replaceState(null,'','/'+base()+'#'+id);$('empty').hidden=true;$('detail').hidden=false;const meta=row.verifier_metadata;$('title').textContent=meta.task_id+' · '+id;$('summary').textContent=`Voxel IoU ${Number(row.reward).toFixed(6)} · ${meta.view_mode} views · ${meta.foreground_color||'original'} · ${meta.engineering_annotations===false?'no engineering annotations':'annotations enabled'}${row.failure_reason?' · '+row.failure_reason:''}`;$('images').replaceChildren();for(const message of row.input){if(message.role!=='user'||!Array.isArray(message.content))continue;let label='Input view';for(const item of message.content){if(item.type==='input_text')label=item.text;else if(item.type==='input_image'&&item.image_url.startsWith('data:image/')){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),image=document.createElement('img');caption.textContent=label;image.src=item.image_url;image.alt=label;figure.append(caption,image);$('images').append(figure)}}}$('comparison').className='comparison'+(meta.view_mode==='axis'?' axis':'');const preview=$('prediction');preview.hidden=!row.has_preview;if(row.has_preview)preview.src='/file/'+base()+'/'+encodeURIComponent(id)+'/prediction.png';$('preview-status').textContent=row.has_preview?(meta.view_mode==='diagonal'?'Generated geometry · same four diagonal cameras':'Generated geometry · front, side, top'):!row.has_step?'No generated solid is available for this response.':row.preview_status?.state==='failed'?'Preview rendering failed; the generated STEP remains available.':'Rendering the generated object…';$('step').hidden=!row.has_step;$('step').href='/file/'+base()+'/'+id+'/prediction.step';draw()}catch(error){$('empty').hidden=false;$('empty').textContent='Unable to load rollout: '+error.message}}
function draw(){if(!detail)return;if(tab==='code')$('text').textContent=detail.code;else if(tab==='output')$('text').textContent=JSON.stringify(detail.output,null,2);else if(tab==='prompt')$('text').textContent=detail.input.map(message=>{const content=typeof message.content==='string'?message.content:(message.content||[]).filter(item=>item.type==='input_text').map(item=>item.text).join('\n');return message.role.toUpperCase()+'\n'+content}).join('\n\n');else{const {input,output,code,...reward}=detail;$('text').textContent=JSON.stringify(reward,null,2)}}
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{tab=button.dataset.tab;draw()});$('experiment').onchange=()=>{experiment=$('experiment').value;page=0;active='';detail=null;history.replaceState(null,'','/'+base());$('detail').hidden=true;$('empty').hidden=false;refresh()};$('search').oninput=$('sort').onchange=()=>{page=0;refresh()};$('refresh').onclick=refresh;$('prev').onclick=()=>{page--;refresh()};$('next').onclick=()=>{page++;refresh()};window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id)select(id)});refresh();setInterval(refresh,5000);
</script>
</html>
